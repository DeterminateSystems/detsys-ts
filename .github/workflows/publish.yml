name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one publish at a time: two concurrent runs would pick the same version.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: write # to create the release tag
      id-token: write # for npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: DeterminateSystems/determinate-nix-action@main
      - uses: DeterminateSystems/flakehub-cache-action@main

      # The version in package.json is not the source of truth: the registry is.
      # Take the latest published version and increment the patch level.
      - name: Calculate the next version
        id: version
        env:
          PACKAGE: "@determinate-systems/detsys-ts"
        run: |
          published=$(nix develop --command npm view "$PACKAGE" version)
          nix develop --command npm version \
            --no-git-tag-version --allow-same-version "$published" > /dev/null
          next=$(nix develop --command npm version --no-git-tag-version patch)
          echo "Publishing $published -> $next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Install npm dependencies
        run: nix develop --command npm ci

      - name: Build
        run: nix develop --command npm run build

      - name: Publish
        run: nix develop --command npm publish --verbose --access public

      - name: Tag ${{ steps.version.outputs.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh api --method POST "/repos/$REPO/git/refs" \
            -f ref="refs/tags/$TAG" \
            -f sha="$SHA"
